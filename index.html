<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { background-color: #1e293b; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h3 { margin: 0 0 10px 0; color: #64748b; font-size: 14px; text-transform: uppercase; }
        .card p { margin: 0; font-size: 28px; font-weight: bold; color: #0f172a; }
        .table-container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="margin:0;">E-Commerce Data Pipeline Dashboard</h1>
        </div>
        
        <div class="card-grid">
            <div class="card">
                <h3>Live Backend Status</h3>
                <p id="api-status" style="color: #ef4444;">Checking...</p>
            </div>
        </div>

        <div class="table-container">
            <h2>Available Products (Transactional DB)</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Stock</th>
                    </tr>
                </thead>
                <tbody id="products-table">
                    <tr><td colspan="4">Loading products...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadDashboardData() {
            try {
                const response = await fetch('http://127.0.0.1:8000/test-db');
                const result = await response.json();
                
                if (result.status === "Connected!") {
                    document.getElementById('api-status').innerText = "ONLINE";
                    document.getElementById('api-status').style.color = "#22c55e";
                    
                    const tbody = document.getElementById('products-table');
                    tbody.innerHTML = '';
                    
                    result.data.forEach(product => {
                        const row = `<tr>
                            <td>${product.id}</td>
                            <td>${product.name}</td>
                            <td>₱${parseFloat(product.price).toLocaleString()}</td>
                            <td>${product.stock}</td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                } else {
                    document.getElementById('api-status').innerText = "DB ERROR";
                }
            } catch (error) {
                document.getElementById('api-status').innerText = "OFFLINE";
            }
        }
        loadDashboardData();
    </script>
</body>
</html>
